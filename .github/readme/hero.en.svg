      <tspan x="24" y="204"><tspan fill="#9AA6FF">await</tspan> lumio.leaderboard.<tspan fill="#5DE2C6">submit</tspan>(<tspan fill="#FFB86B">'stats.bestScore'</tspan>, <tspan fill="#FFB86B">1000</tspan>);</tspan>
      <tspan x="24" y="238" font-size="13" fill="#7480A8">// not allowed? platform.not_granted</tspan>
    </text>
