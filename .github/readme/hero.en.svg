    <text font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#F6F7FD">
      <tspan x="24" y="70" fill="#7480A8">$ npm i @lumiogames/sdk</tspan>
      <tspan x="24" y="108"><tspan fill="#9AA6FF">import</tspan> { <tspan fill="#5DE2C6">connectLumioFromLaunch</tspan> } <tspan fill="#9AA6FF">from</tspan> <tspan fill="#FFB86B">'@lumiogames/sdk'</tspan>;</tspan>
      <tspan x="24" y="144"><tspan fill="#9AA6FF">const</tspan> lumio = <tspan fill="#9AA6FF">await</tspan> <tspan fill="#5DE2C6">connectLumioFromLaunch</tspan>();</tspan>
